<canvas id="game"></canvas>
<script>
(function () {
"use strict";

/* ============================================================
   AFFENJAGD — Fangis auf einem Baum

   Zwei Affen. Wer "es" ist, traegt ein rotes Herz ueber dem Kopf
   und muss den anderen fangen. Bei Beruehrung wechselt die Rolle,
   und der neue Faenger bleibt kurz stehen, damit der andere
   fliehen kann. Gespielt wird, bis jeder dreimal Faenger war.

   Der Spieler traegt die weisse Blume, der Gegner die Banane.
   ============================================================ */

// ---------- Maße ----------
const TILE = 10;
const COLS = 18;
const W = COLS * TILE;
const HUD_ROWS = 4;
const LEVEL_GAP = 5;
let ROWS, H;

// ---------- Spielwerte ----------
const IT_TARGET     = 3;      // so oft muss jeder Faenger gewesen sein
const RUN_SPEED     = 66;
const CLIMB_SPEED   = 48;
const GRAVITY       = 430;
const JUMP_VEL      = -145;
const MAX_FALL      = 290;
const DROP_TIME     = 0.28;
const FREEZE_TIME   = 3.0;    // Vorsprung fuer den Geflohenen
const START_FREEZE  = 2.0;
const TAG_IMMUNE    = 0.8;    // nur gegen sofortiges Zurueckfangen
const SLIP_TIME     = 1.1;    // Banane
const SNIFF_TIME    = 1.4;    // Blume
const ITEM_COOLDOWN = 6.0;
const ITEM_LIFE     = 9.0;
const AI_SPEED_MUL  = 0.87;   // der Rechner laeuft langsamer als du
const AI_FLEE_MUL   = 0.78;   // auf der Flucht noch etwas langsamer,
                              // sonst ist er nicht zu stellen
const PTS_PER_SEC   = 10;
const TAG_BONUS     = 25;

// ---------- Farben ----------
const SKY_TOP    = "#13324a";
const SKY_BOTTOM = "#2b6b3f";
const BARK       = "#7a4b23";
const BARK_TOP   = "#a8712f";
const BARK_DARK  = "#54331a";
const LEAF_A     = "#4cb35a";
const LEAF_B     = "#2d7738";
const LEAF_C     = "#69c96f";
const VINE_A     = "#4bb257";
const VINE_B     = "#2f7d3a";
const EARTH      = "#5a3b1e";
const GRASS      = "#46a352";

// ---------- Zufall mit festem Startwert: Karte immer gleich ----------
let seed = 20260726;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

/* ============================================================
   Karte
   grid:  "." leer   "=" Ast (von unten durchlaessig)   "#" Boden
   vines: true, wenn dort eine Liane haengt
   ============================================================ */
let grid = null, vines = null, platformRows = [], leaves = [];

function inside(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }
function isGround(c, r) {
  if (c < 0 || c >= COLS) return true;
  if (r < 0) return false;
  if (r >= ROWS) return true;
  return grid[r][c] === "#";
}
function isPlatform(c, r) { return inside(c, r) && grid[r][c] === "="; }
function isVine(c, r) { return inside(c, r) && vines[r][c]; }

function buildMap() {
  seed = 20260726;
  grid = []; vines = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push(new Array(COLS).fill("."));
    vines.push(new Array(COLS).fill(false));
  }

  for (let c = 0; c < COLS; c++) { grid[ROWS - 1][c] = "#"; grid[ROWS - 2][c] = "#"; }

  platformRows = [];
  for (let r = ROWS - 2 - LEVEL_GAP; r >= HUD_ROWS + 2; r -= LEVEL_GAP) platformRows.push(r);
  for (const rp of platformRows) for (let c = 0; c < COLS; c++) grid[rp][c] = "=";

  // Lianen reichen eine Reihe ueber den Ast hinaus, damit man sie
  // im Stehen greifen kann.
  for (let i = 0; i < platformRows.length; i++) {
    const rp = platformRows[i];
    const rBelow = (i === 0) ? ROWS - 2 : platformRows[i - 1];
    const cols = [];
    let guard = 0;
    while (cols.length < 2 && guard++ < 500) {
      const c = 2 + Math.floor(rnd() * (COLS - 4));
      if (cols.every(x => Math.abs(x - c) >= 5)) cols.push(c);
    }
    for (const c of cols) {
      for (let r = rp - 1; r <= rBelow - 1; r++) vines[r][c] = true;
    }
  }

  buildLeaves();
}

// Blattwerk: reine Deko, wackelt sanft. Haengt an Aesten und Lianen —
// frei schwebende Blaetter sehen aus wie Konfetti, nicht wie Laub.
function buildLeaves() {
  leaves = [];
  let s = 8125;
  const r = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
  const pick = () => { const v = r(); return v < 0.4 ? LEAF_B : (v < 0.8 ? LEAF_A : LEAF_C); };

  // ein Bueschel: mehrere Blaetter dicht beieinander, die gemeinsam wackeln
  const clump = (cx, cy, n, spread, amp, sp) => {
    const phase = r() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      leaves.push({
        x: cx + (r() - 0.5) * spread,
        y: cy + (r() - 0.5) * spread * 0.6,
        w: 2 + Math.floor(r() * 3),
        h: 2 + Math.floor(r() * 2),
        col: pick(), amp, sp, phase
      });
    }
  };

  // Laub oben auf und unter den Aesten
  for (const rp of platformRows) {
    for (let c = 0; c < COLS; c++) {
      if (r() < 0.62) {
        clump(c * TILE + TILE / 2, rp * TILE - 2,
              3 + Math.floor(r() * 3), 8, 0.8 + r() * 1.1, 1.0 + r() * 1.2);
      }
      if (r() < 0.3) {
        clump(c * TILE + TILE / 2, rp * TILE + 9,
              2 + Math.floor(r() * 2), 6, 1.1 + r() * 1.4, 0.9 + r() * 1.2);
      }
    }
  }
  // ein paar Ranken an den Lianen
  for (let rr = 0; rr < ROWS; rr++) {
    for (let c = 0; c < COLS; c++) {
      if (!vines[rr][c] || r() > 0.2) continue;
      clump(c * TILE + (r() < 0.5 ? 1 : 9), rr * TILE + TILE / 2,
            2, 5, 1.0 + r() * 1.3, 1.2 + r() * 1.3);
    }
  }
}

/* ============================================================
   Navigationsgraph fuer den Gegner
   ============================================================ */
let adj = [], radj = [], distToPlayer = null, distToRefuge = null;
function idx(c, r) { return r * COLS + c; }
function navFree(c, r) { return inside(c, r) && !isGround(c, r); }
function navSupported(c, r) {
  if (!inside(c, r)) return false;
  return isGround(c, r + 1) || isPlatform(c, r + 1) || isVine(c, r);
}

function buildNav() {
  const n = COLS * ROWS;
  adj = new Array(n); radj = new Array(n);
  for (let i = 0; i < n; i++) { adj[i] = []; radj[i] = []; }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!navFree(c, r)) continue;
      const from = idx(c, r);
      if (navSupported(c, r)) {
        for (const dc of [-1, 1]) if (navFree(c + dc, r)) adj[from].push(idx(c + dc, r));
        if (isVine(c, r) && isVine(c, r - 1)) adj[from].push(idx(c, r - 1));
      }
      if (navFree(c, r + 1)) adj[from].push(idx(c, r + 1));
    }
  }
  for (let i = 0; i < n; i++) for (const j of adj[i]) radj[j].push(i);
  distToPlayer = new Int32Array(n);
  distToRefuge = new Int32Array(n);
}

// field[X] = Anzahl Schritte von Kachel X bis zum Ziel. Deshalb wird
// vom Ziel aus ueber die umgekehrten Kanten gesucht.
const bfsQueue = [];
function computeField(tc, tr, field) {
  field.fill(-1);
  if (!inside(tc, tr)) return;
  let start = idx(tc, tr);
  if (!navFree(tc, tr)) {
    let found = -1;
    for (let d = 1; d <= 4 && found < 0; d++) {
      if (navFree(tc, tr - d)) found = idx(tc, tr - d);
      else if (navFree(tc, tr + d)) found = idx(tc, tr + d);
    }
    if (found < 0) return;
    start = found;
  }
  bfsQueue.length = 0;
  bfsQueue.push(start);
  field[start] = 0;
  let head = 0;
  while (head < bfsQueue.length) {
    const cur = bfsQueue[head++];
    const d = field[cur] + 1;
    const nb = radj[cur];
    for (let k = 0; k < nb.length; k++) {
      if (field[nb[k]] === -1) { field[nb[k]] = d; bfsQueue.push(nb[k]); }
    }
  }
}

/* ============================================================
   Sprites
   ============================================================ */
const MONKEY = [
  "................",
  "....oooooooo....",
  "..ooFFFFFFFFoo..",
  ".oFFFFFFFFFFFFo.",
  "ooFFssssssssFFoo",
  "oFFFssssssssFFFo",
  "oFFswEwsswEwsFFo",
  "ooFFssssssssFFoo",
  ".oFFssmmmmssFFo.",
  "..ooFFssssFFoo..",
  "...oFFFFFFFFo...",
  "..oFFffffffFFo..",
  ".oFFffffffffFFo.",
  ".oFFffffffffFFo.",
  "..oFFo....oFFo..",
  "..oooo....oooo.."
];

const BANANA = [
  "....bbo..",
  "...oyyyo.",
  "..oyyyyo.",
  "..oyyyo..",
  ".oyyyo...",
  ".oyyyo...",
  "..oyyo...",
  "..oyyo...",
  "...oo...."
];

const FLOWER = [
  "...ooo...",
  "..oWWWo..",
  ".oWWWWWo.",
  "oWWWYWWWo",
  "oWWWYWWWo",
  ".oWWWWWo.",
  "..oWWWo..",
  "...ogo...",
  "...ogo..."
];

const HEART = [
  ".oo.oo.",
  "oRhoRRo",
  "oRRRRRo",
  ".oRRRo.",
  "..oRo..",
  "...o..."
];

// Beide Affen braun, der Gegner eine Spur dunkler und kuehler,
// damit man im Gewuehl noch erkennt, wer man selbst ist.
const PAL_PLAYER = { o:"#2b1a0e", F:"#9c6530", f:"#d29a58", s:"#f0c893", w:"#ffffff", E:"#241109", m:"#9a5340" };
const PAL_RIVAL  = { o:"#241407", F:"#6f4520", f:"#9c6f3e", s:"#c9a074", w:"#ffffff", E:"#241109", m:"#7a3f30" };
const PAL_ITEM   = { o:"#2b1a0e", y:"#f5d13b", b:"#7a4b23", W:"#fdfdf5", Y:"#f5b93b", g:"#2f7d3a" };
const PAL_HEART  = { o:"#2b1a0e", R:"#ff3b28", h:"#ff9a8a" };
const PAL_HEART_OFF = { o:"#3d4a42", R:"#25322b", h:"#25322b" };

function makeSprite(art, pal) {
  const h = art.length, w = art[0].length;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = pal[art[y][x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

const SPR = {};
function buildSprites() {
  SPR.player    = makeSprite(MONKEY, PAL_PLAYER);
  SPR.rival     = makeSprite(MONKEY, PAL_RIVAL);
  SPR.banana    = makeSprite(BANANA, PAL_ITEM);
  SPR.flower    = makeSprite(FLOWER, PAL_ITEM);
  SPR.heart     = makeSprite(HEART, PAL_HEART);
  SPR.heartOff  = makeSprite(HEART, PAL_HEART_OFF);
  SPR.hug       = buildHugScene();
}

// Endbild: beide Affen sitzen auf einem Ast und umarmen sich.
// Aus den vorhandenen Sprites zusammengesetzt, damit der Stil passt.
function buildHugScene() {
  const w = 40, h = 24;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;

  const BRANCH_Y = 17;

  // dicht aneinander, damit es nach Anschmiegen aussieht
  g.drawImage(SPR.player, 5, 2);
  g.save();
  g.translate(19 + 16, 2); g.scale(-1, 1);
  g.drawImage(SPR.rival, 0, 0);
  g.restore();

  // Keine Arme quer durchs Bild — nur je eine Hand, die ueber der
  // aeusseren Schulter des anderen auftaucht.
  const hand = (x, y, fur) => {
    g.fillStyle = "#241407"; g.fillRect(x, y - 1, 5, 6);
    g.fillStyle = fur;       g.fillRect(x + 1, y, 3, 4);
    g.fillStyle = "#241407"; g.fillRect(x + 1, y + 2, 3, 1);   // Finger
  };
  hand(30, 12, "#d29a58");   // Hand des linken Affen
  hand(5, 13, "#9c6f3e");    // Hand des rechten Affen

  // Ast, auf dem sie sitzen, verdeckt die Beine
  g.fillStyle = BARK;      g.fillRect(1, BRANCH_Y, w - 2, 4);
  g.fillStyle = BARK_TOP;  g.fillRect(1, BRANCH_Y, w - 2, 1);
  g.fillStyle = BARK_DARK; g.fillRect(1, BRANCH_Y + 3, w - 2, 1);
  g.fillStyle = "#241407";
  g.fillRect(0, BRANCH_Y + 1, 1, 2); g.fillRect(w - 1, BRANCH_Y + 1, 1, 2);

  // zwei dunkle Blattbueschel an den Astenden
  const sprig = (x) => {
    g.fillStyle = "#241407"; g.fillRect(x, BRANCH_Y + 4, 5, 3);
    g.fillStyle = LEAF_B;    g.fillRect(x + 1, BRANCH_Y + 4, 3, 2);
  };
  sprig(3); sprig(32);

  // Blume und Banane liegen vorne auf dem Ast, zuletzt gezeichnet
  g.drawImage(SPR.flower, 8, 13);
  g.drawImage(SPR.banana, 23, 13);

  return cv;
}

/* ============================================================
   Affen
   ============================================================ */
const HB_W = 9, HB_H = 14;
const SPR_OFF_X = -3.5, SPR_OFF_Y = -2;
const ITEM_W = 9, ITEM_H = 9;

function makeMonkey(isPlayer) {
  return {
    isPlayer,
    x: 0, y: 0, vx: 0, vy: 0,
    face: 1,
    onGround: false, onVine: false,
    dropTimer: 0,
    it: false, itCount: 0,
    slip: 0, sniff: 0, freeze: 0, immune: 0,
    itemReady: true, itemTimer: 0,
    anim: 0, hurtFlash: 0
  };
}

let player, rival, drops = [], particles = [];

function centerTile(m) {
  return { c: Math.floor((m.x + HB_W / 2) / TILE), r: Math.floor((m.y + HB_H / 2) / TILE) };
}

function moveX(m, dx) {
  if (dx === 0) return;
  m.x += dx;
  const c0 = Math.floor(m.x / TILE), c1 = Math.floor((m.x + HB_W - 1) / TILE);
  const r0 = Math.floor(m.y / TILE), r1 = Math.floor((m.y + HB_H - 1) / TILE);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (!isGround(c, r)) continue;
      m.x = (dx > 0) ? c * TILE - HB_W : (c + 1) * TILE;
      m.vx = 0;
      return;
    }
  }
}

function moveY(m, dy) {
  if (dy === 0) return;
  const prevBottom = m.y + HB_H;
  m.y += dy;
  const c0 = Math.floor(m.x / TILE), c1 = Math.floor((m.x + HB_W - 1) / TILE);
  const r0 = Math.floor(m.y / TILE), r1 = Math.floor((m.y + HB_H - 1) / TILE);
  const canLand = (dy > 0) && m.dropTimer <= 0 && !m.onVine;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (isGround(c, r)) {
        if (dy > 0) { m.y = r * TILE - HB_H; m.onGround = true; }
        else m.y = (r + 1) * TILE;
        m.vy = 0;
        return;
      }
      if (canLand && isPlatform(c, r) && prevBottom <= r * TILE + 1.5) {
        m.y = r * TILE - HB_H; m.onGround = true; m.vy = 0;
        return;
      }
    }
  }
}

function updateMonkey(m, dir, dt, speedMul) {
  m.anim += dt;
  if (m.immune > 0) m.immune -= dt;
  if (m.hurtFlash > 0) m.hurtFlash -= dt;
  if (m.dropTimer > 0) m.dropTimer -= dt;
  if (!m.itemReady) {
    m.itemTimer -= dt;
    if (m.itemTimer <= 0) { m.itemReady = true; m.itemTimer = 0; }
  }

  let inX = dir.x, inY = dir.y;
  if (m.freeze > 0) { m.freeze -= dt; inX = 0; inY = 0; }
  if (m.sniff > 0)  { m.sniff  -= dt; inX = 0; inY = 0; }
  if (m.slip > 0)   { m.slip   -= dt; inX = 0; inY = 0; m.onVine = false; }

  const blocked = m.freeze > 0 || m.sniff > 0 || m.slip > 0;
  const cen = centerTile(m);
  const footRow = Math.floor((m.y + HB_H + 1) / TILE);
  const onHardGround = isGround(cen.c, footRow);
  // Beim Ausrutschen verliert man den Halt. Wer nur innehaelt oder
  // schnuppert, darf an der Liane haengen bleiben.
  const overVine = isVine(cen.c, cen.r) && m.slip <= 0;

  // "Runter" gegen festen Boden ist eine Sackgasse. "Hoch" ist nie
  // eine: oben steigt man von selbst auf den Ast aus.
  const deadEnd = (inY > 0 && onHardGround);

  // Greifen und Loslassen. Wer an der Liane haengt, bleibt dort —
  // eine leicht schraege Daumenhaltung darf einen nicht herunter-
  // reissen. Loesen geht nur ueber eine reine Seitwaertsbewegung
  // oder wenn die Kletterrichtung in eine Wand laeuft.
  if (!overVine) m.onVine = false;
  else if (inY !== 0 && !deadEnd) m.onVine = true;
  else if (m.onVine && inX !== 0) m.onVine = false;

  if (m.onVine) {
    m.vy = inY * CLIMB_SPEED * speedMul;
    m.vx = 0;
    m.onGround = false;
    m.dropTimer = 0;
    // immer zur Lianenmitte ziehen, damit man nicht abrutscht
    const target = cen.c * TILE + (TILE - HB_W) / 2;
    m.x += (target - m.x) * Math.min(1, 14 * dt);
  } else {
    if (blocked) {
      m.vx = 0;
    } else {
      m.vx = inX * RUN_SPEED * speedMul;
      if (inY < 0 && m.onGround) {
        m.vy = JUMP_VEL; m.onGround = false; blip(430, 0.05);
      } else if (inY > 0 && m.onGround && !onHardGround) {
        m.dropTimer = DROP_TIME; m.onGround = false; m.vy = 40;
      }
    }
    m.vy = Math.min(m.vy + GRAVITY * dt, MAX_FALL);
  }

  if (inX !== 0 && !blocked) m.face = inX > 0 ? 1 : -1;

  m.onGround = false;
  moveX(m, m.vx * dt);
  moveY(m, m.vy * dt);

  if (m.x < 0) { m.x = 0; m.vx = 0; }
  if (m.x > W - HB_W) { m.x = W - HB_W; m.vx = 0; }
  if (m.y > H) { m.y = H - HB_H - TILE * 2; m.vy = 0; }
}

/* ============================================================
   Blume und Banane
   ============================================================ */
// Welches Symbol der Spieler auf der Startseite gewaehlt hat.
// Der Gegner bekommt das andere.
let playerItem = "flower";
function otherItem(kind) { return kind === "flower" ? "banana" : "flower"; }
function itemKindOf(m) { return m.isPlayer ? playerItem : otherItem(playerItem); }

function dropItem(m) {
  if (!m.itemReady || m.freeze > 0 || m.sniff > 0 || m.slip > 0) return;
  m.itemReady = false;
  m.itemTimer = ITEM_COOLDOWN;
  drops.push({
    kind: itemKindOf(m),
    owner: m,
    // vor sich hin ablegen, auf der Seite, auf der man es traegt
    x: Math.max(0, Math.min(W - ITEM_W, m.x + HB_W / 2 - ITEM_W / 2 + m.face * 7)),
    y: m.y + HB_H - ITEM_H,
    vy: 0, life: ITEM_LIFE, born: 0
  });
  blip(300, 0.05);
}

function itemHits(d, m) {
  return d.x + ITEM_W - 1 > m.x && d.x + 1 < m.x + HB_W &&
         d.y + ITEM_H - 1 > m.y && d.y + 1 < m.y + HB_H;
}

function updateDrops(dt) {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.life -= dt; d.born += dt;

    const prevBottom = d.y + ITEM_H;
    d.vy = Math.min(d.vy + GRAVITY * dt, MAX_FALL);
    d.y += d.vy * dt;
    const c = Math.floor((d.x + ITEM_W / 2) / TILE);
    const r = Math.floor((d.y + ITEM_H - 1) / TILE);
    if (isGround(c, r) || (isPlatform(c, r) && prevBottom <= r * TILE + 2)) {
      d.y = r * TILE - ITEM_H; d.vy = 0;
    }
    if (d.y > H) { drops.splice(i, 1); continue; }

    const victim = (d.owner === player) ? rival : player;
    if (d.born > 0.3 && itemHits(d, victim)) {
      if (d.kind === "banana") {
        // Haelt an Ort und Stelle an. Frueher schleuderte sie das Opfer
        // mit Schwung weiter — im Verfolgungsfall rutschte der Faenger
        // dadurch nur schneller in den Verfolgten hinein.
        victim.slip = SLIP_TIME;
        victim.vx = 0;
        victim.onVine = false;      // Halt verlieren: von der Liane faellt man
        burst(d.x + 4, d.y + 4, "#f5d13b", 10);
        toast(victim.isPlayer ? "You slipped!" : "He slipped!", "#f5d13b");
        blip(170, 0.14);
      } else {
        victim.sniff = SNIFF_TIME;
        victim.vx = 0;
        burst(d.x + 4, d.y + 4, "#fdfdf5", 10);
        toast(victim.isPlayer ? "Smells too good..." : "He stops to sniff!", "#fdfdf5");
        blip(660, 0.14);
      }
      drops.splice(i, 1);
      continue;
    }
    if (d.life <= 0) drops.splice(i, 1);
  }
}

/* ============================================================
   Effekte
   ============================================================ */
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 75,
      vy: -Math.random() * 70 - 12,
      life: 0.5 + Math.random() * 0.3,
      col
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vy += GRAVITY * 0.5 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

let toastText = "", toastTime = 0, toastCol = "#fff";
function toast(txt, col) { toastText = txt; toastTime = 1.5; toastCol = col || "#fff"; }

/* ============================================================
   Ton
   ============================================================ */
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}
function blip(freq, dur) {
  if (!audioCtx || audioCtx.state !== "running") return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.value = 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* Ton ist Beigabe */ }
}

/* ============================================================
   Gegner
   ============================================================ */
let navTimer = 0, aiPause = 0;
let refugeC = -1, refugeR = -1, refugeTimer = 0, refugeCooldown = 0;
let aiHoldX = 0, aiHoldTimer = 0;

// Ein festes Ziel weit weg vom Spieler suchen. Frueher wurde beim
// Fliehen jeden Frame gierig das weiteste Nachbarfeld genommen — dabei
// wechseln sich zwei benachbarte Felder staendig als "das weiteste" ab
// und die Figur zappelt dazwischen, bis sie in der untersten Ecke
// kreiselt. Mit einem festen Ziel laeuft sie ruhig und zielgerichtet.
function pickRefuge() {
  let max = 0;
  for (let i = 0; i < distToPlayer.length; i++) if (distToPlayer[i] > max) max = distToPlayer[i];
  if (max < 3) return false;

  // Nicht immer der sicherste Ort: sonst ist er kaum zu stellen und
  // die Runde zieht sich. Ab und zu waehlt er absichtlich mittelmaessig.
  const faktor = (Math.random() < 0.35) ? 0.25 : 0.55;
  const schwelle = Math.max(3, Math.floor(max * faktor));
  const kandidaten = [];
  for (let i = 0; i < distToPlayer.length; i++) {
    if (distToPlayer[i] < schwelle) continue;
    const c = i % COLS, r = (i - c) / COLS;
    if (!navSupported(c, r)) continue;      // nur Felder, auf denen man stehen kann
    kandidaten.push(i);
  }
  if (!kandidaten.length) return false;

  const wahl = kandidaten[Math.floor(Math.random() * kandidaten.length)];
  refugeC = wahl % COLS;
  refugeR = (wahl - refugeC) / COLS;
  computeField(refugeC, refugeR, distToRefuge);
  refugeTimer = 1.5 + Math.random();
  refugeCooldown = 0.4;
  return true;
}

function updateAI(dt) {
  navTimer -= dt;
  aiPause -= dt;
  refugeTimer -= dt;
  refugeCooldown -= dt;

  // Das Entfernungsfeld ist teuer und darf altern.
  if (navTimer <= 0) {
    navTimer = 0.12;
    const pt = centerTile(player);
    computeField(pt.c, pt.r, distToPlayer);

    if (aiPause <= 0 && Math.random() < 0.05) aiPause = 0.22;
    const dist = Math.hypot(player.x - rival.x, player.y - rival.y);
    if (rival.itemReady && dist < (rival.it ? 58 : 44) && Math.random() < 0.3) dropItem(rival);
  }

  const rt = centerTile(rival);
  const here = inside(rt.c, rt.r) ? idx(rt.c, rt.r) : -1;

  // Fluchtziel pflegen: neu waehlen, wenn erreicht, abgelaufen,
  // unerreichbar oder der Verfolger dicht dran ist.
  if (!rival.it && here >= 0) {
    const erreicht  = (rt.c === refugeC && rt.r === refugeR);
    const bedraengt = distToPlayer[here] >= 0 && distToPlayer[here] <= 3;
    if (refugeC < 0 || erreicht || refugeTimer <= 0 ||
        distToRefuge[here] < 0 || (bedraengt && refugeCooldown <= 0)) {
      pickRefuge();
    }
  }

  // Die Richtung jeden Frame neu aus der aktuellen Kachel ableiten.
  // Sonst haelt die Figur nach einer Landung noch kurz die
  // Abwaerts-Eingabe von unterwegs — und "runter" auf einem Ast heisst
  // durchfallen. So sackte sie Ebene um Ebene bis nach unten durch.
  let dirX = 0, dirY = 0;
  if (here >= 0) {
    const feld = rival.it ? distToPlayer : distToRefuge;
    const options = adj[here] || [];
    let bestScore = Infinity, best = -1;
    for (const nb of options) {
      const v = feld[nb];
      if (v < 0) continue;
      if (v < bestScore) { bestScore = v; best = nb; }
    }
    if (best >= 0) {
      const bc = best % COLS, br = (best - bc) / COLS;
      // Auf die Mitte der Zielkachel zielen statt nur aufs Vorzeichen.
      // Steht das Ziel senkrecht ueber oder unter uns, faellt die
      // Seitwaertsbewegung damit von selbst weg.
      const zielX = bc * TILE + TILE / 2;
      const mitteX = rival.x + HB_W / 2;
      dirX = (Math.abs(zielX - mitteX) < 3.5) ? 0 : Math.sign(zielX - mitteX);
      dirY = Math.sign(br - rt.r);
    } else {
      dirX = Math.sign(player.x - rival.x) * (rival.it ? 1 : -1);
      dirY = 0;
    }
  }

  // Kurze Bindung an die Laufrichtung. An einer Kachelgrenze kann das
  // Entfernungsfeld sonst zwischen links und rechts kippen, und die
  // Figur zappelt mit 25 Wechseln pro Sekunde auf der Stelle.
  aiHoldTimer -= dt;
  if (dirX === 0) {
    aiHoldX = 0;
  } else if (dirX !== aiHoldX) {
    if (aiHoldTimer <= 0) { aiHoldX = dirX; aiHoldTimer = 0.22; }
    else dirX = aiHoldX;
  }

  // In der Luft keine senkrechte Eingabe, sonst faellt sie beim
  // Aufkommen sofort durch den naechsten Ast. Und "hoch" nur an einer
  // Liane — anderswo huepft sie davon bloss sinnlos herum.
  const airborne = !rival.onGround && !rival.onVine;
  if (airborne) dirY = 0;
  else if (dirY < 0 && !isVine(rt.c, rt.r)) dirY = 0;

  const tempo = rival.it ? AI_SPEED_MUL : AI_FLEE_MUL;
  updateMonkey(rival, (aiPause > 0) ? { x: 0, y: 0 } : { x: dirX, y: dirY }, dt, tempo);
}

/* ============================================================
   Eingabe
   ============================================================ */
const keys = {};
let stickId = null, stickOX = 0, stickOY = 0, stickX = 0, stickY = 0, stickActive = false;
const DEAD = 5;
const itemBtn = { x: 0, y: 0, r: 20 };

function inputDir() {
  let x = 0, y = 0;
  if (stickActive) {
    const dx = stickX - stickOX, dy = stickY - stickOY;
    if (dx > DEAD) x = 1; else if (dx < -DEAD) x = -1;
    if (dy > DEAD) y = 1; else if (dy < -DEAD) y = -1;
  }
  if (keys.ArrowLeft  || keys.a) x = -1;
  if (keys.ArrowRight || keys.d) x = 1;
  if (keys.ArrowUp    || keys.w) y = -1;
  if (keys.ArrowDown  || keys.s) y = 1;
  return { x, y };
}

/* ============================================================
   Ablauf
   ============================================================ */
const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
let state = STATE.TITLE;
let score = 0, best = 0;
try { best = parseInt(localStorage.getItem("affenjagd_best") || "0", 10) || 0; } catch (e) { best = 0; }

function resetRound() {
  drops = []; particles = [];
  score = 0;
  toastText = ""; toastTime = 0;

  player = makeMonkey(true);
  rival  = makeMonkey(false);

  player.x = W / 2 - HB_W / 2;
  player.y = (ROWS - 2) * TILE - HB_H;

  const topRow = platformRows[platformRows.length - 1];
  rival.x = 2 * TILE;
  rival.y = topRow * TILE - HB_H;

  // Der Gegner faengt an. Das zaehlt als seine erste Runde als Faenger.
  rival.it = true;  rival.itCount = 1;
  player.it = false; player.itCount = 0;
  rival.freeze = START_FREEZE;
  rival.immune = START_FREEZE;

  navTimer = 0; aiPause = 0;
  refugeC = -1; refugeR = -1; refugeTimer = 0; refugeCooldown = 0;
  aiHoldX = 0; aiHoldTimer = 0;
}

function swapRoles(tagger) {
  const other = (tagger === player) ? rival : player;
  tagger.it = false;
  other.it = true;
  other.itCount++;
  // Nur der neue Faenger wird kurz blockiert. Der Geflohene behaelt
  // seinen Schwung und laeuft ungebremst weiter; er ist lediglich
  // solange nicht antastbar, damit ihn niemand sofort zurueckfangt.
  tagger.immune = TAG_IMMUNE;
  other.immune = TAG_IMMUNE;
  other.freeze = FREEZE_TIME;
  other.hurtFlash = 0.4;

  if (tagger === player) {
    score += TAG_BONUS;
    toast("Tagged him! +" + TAG_BONUS, "#ffe066");
    blip(880, 0.13);
  } else {
    toast("You're it! Run!", "#ff6b5a");
    blip(150, 0.2);
  }
  burst(other.x + HB_W / 2, other.y + HB_H / 2, "#ff6b5a", 14);

  if (player.itCount >= IT_TARGET && rival.itCount >= IT_TARGET) endRound();
}

function endRound() {
  state = STATE.OVER;
  const s = Math.floor(score);
  if (s > best) {
    best = s;
    try { localStorage.setItem("affenjagd_best", String(best)); } catch (e) {}
  }
  blip(660, 0.25);
}

// Wer sich nicht bewegen kann, kann auch nicht fangen. Sonst ist der
// eingefrorene Faenger eine Tretmine: man kommt an ihm nicht vorbei,
// obwohl seine Sperre gerade den Vorsprung sichern soll.
function canTag(m) {
  return m.it && m.freeze <= 0 && m.sniff <= 0 && m.slip <= 0;
}

function checkTag() {
  if (player.immune > 0 || rival.immune > 0) return;
  const hit = player.x + HB_W > rival.x && player.x < rival.x + HB_W &&
              player.y + HB_H > rival.y && player.y < rival.y + HB_H;
  if (!hit) return;
  if (canTag(player)) swapRoles(player);
  else if (canTag(rival)) swapRoles(rival);
}

/* ============================================================
   Zeichnen
   ============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
let scale = 1, bgCache = null, clock = 0;

function layout() {
  // Manche Umgebungen melden beim ersten Aufruf noch 0 — ohne diese
  // Absicherung wird ROWS zu NaN und der Kartenaufbau stuerzt ab.
  const vw = window.innerWidth  || document.documentElement.clientWidth  || 390;
  const vh = window.innerHeight || document.documentElement.clientHeight || 780;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  let rows = Math.round((W * vh / vw) / TILE);
  if (!isFinite(rows)) rows = 39;
  rows = Math.max(28, Math.min(46, rows));
  const rebuild = (rows !== ROWS) || !grid;
  ROWS = rows;
  H = ROWS * TILE;

  scale = Math.min(vw / W, vh / H);
  canvas.style.width  = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width  = Math.floor(W * scale * dpr);
  canvas.height = Math.floor(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  itemBtn.x = 28; itemBtn.y = H - 26;
  layoutTitle();

  if (rebuild) {
    buildMap();
    buildNav();
    bgCache = null;
    resetRound();
    if (state === STATE.PLAY) state = STATE.TITLE;
  }
}

function drawBackground() {
  if (bgCache && bgCache.width === W && bgCache.height === H) {
    ctx.drawImage(bgCache, 0, 0);
    return;
  }
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");

  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, SKY_TOP);
  grad.addColorStop(1, SKY_BOTTOM);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  // dichtes, dunkles Blattwerk als Tiefe
  let s2 = 4242;
  const r2 = () => { s2 = (s2 * 1103515245 + 12345) >>> 0; return s2 / 4294967296; };
  g.globalAlpha = 0.2;
  for (let i = 0; i < 150; i++) {
    const x = Math.floor(r2() * W), y = Math.floor(r2() * H);
    g.fillStyle = r2() > 0.5 ? LEAF_A : LEAF_B;
    g.fillRect(x, y, 5 + Math.floor(r2() * 16), 3 + Math.floor(r2() * 9));
  }
  g.globalAlpha = 1;

  g.fillStyle = "rgba(58,36,17,0.4)";
  g.fillRect(Math.floor(W / 2) - 13, 0, 26, H);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!vines[r][c]) continue;
      const x = c * TILE, y = r * TILE;
      g.fillStyle = VINE_B; g.fillRect(x + 3, y, 4, TILE);
      g.fillStyle = VINE_A; g.fillRect(x + 4, y, 2, TILE);
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === "=") {
        g.fillStyle = BARK;      g.fillRect(x, y, TILE, 7);
        g.fillStyle = BARK_TOP;  g.fillRect(x, y, TILE, 2);
        g.fillStyle = BARK_DARK; g.fillRect(x, y + 5, TILE, 2);
        g.fillStyle = "rgba(0,0,0,0.12)";
        g.fillRect(x + ((c * 5) % 7), y + 3, 1, 2);
      } else if (t === "#") {
        g.fillStyle = EARTH; g.fillRect(x, y, TILE, TILE);
        if (r === ROWS - 2) { g.fillStyle = GRASS; g.fillRect(x, y, TILE, 3); }
        g.fillStyle = "rgba(0,0,0,0.16)";
        g.fillRect(x + ((c * 7) % 6), y + 5, 2, 2);
      }
    }
  }

  bgCache = cv;
  ctx.drawImage(bgCache, 0, 0);
}

function drawLeaves() {
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    const dx = Math.sin(clock * l.sp + l.phase) * l.amp;
    const dy = Math.cos(clock * l.sp * 0.6 + l.phase) * l.amp * 0.45;
    ctx.fillStyle = l.col;
    ctx.fillRect(Math.round(l.x + dx), Math.round(l.y + dy), l.w, l.h);
  }
}

function drawSprite(cv, x, y, flip) {
  const px = Math.round(x), py = Math.round(y);
  if (flip < 0) {
    ctx.save();
    ctx.translate(px + cv.width, py);
    ctx.scale(-1, 1);
    ctx.drawImage(cv, 0, 0);
    ctx.restore();
  } else {
    ctx.drawImage(cv, px, py);
  }
}

function drawSpriteScaled(cv, x, y, k) {
  ctx.drawImage(cv, 0, 0, cv.width, cv.height,
                Math.round(x), Math.round(y), cv.width * k, cv.height * k);
}

// Zweitakt statt Sinus. Ein Sinus mit weniger als einem Pixel
// Ausschlag wird beim Runden auf ganze Pixel zu Geflacker; ein fester
// Takt sieht nach Schritt aus.
function stepBob(anim, takt) {
  return (Math.floor(anim / takt) % 2) ? -1 : 0;
}

function drawMonkey(m) {
  const spr = m.isPlayer ? SPR.player : SPR.rival;
  let bob = 0;
  const laeuft = (m.onVine && Math.abs(m.vy) > 1) || (m.onGround && Math.abs(m.vx) > 1);
  if (laeuft) bob = stepBob(m.anim, 0.28);

  const sx = m.x + SPR_OFF_X;
  const sy = m.y + SPR_OFF_Y + bob;

  // rotes Herz ueber dem Kopf zeigt, wer "es" ist
  if (m.it) {
    const hx = m.x + HB_W / 2 - 3.5;
    const hy = m.y - 10 + stepBob(m.anim, 0.42) * 2;
    drawSprite(SPR.heart, hx, hy, 1);
  }

  // Nur der eben Gefangene flackert. Der Geflohene ist zwar auch
  // kurz unantastbar, soll aber nicht aussehen wie bestraft.
  if (m.hurtFlash > 0 && Math.floor(m.hurtFlash * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  else if (m.freeze > 0 && Math.floor(m.freeze * 12) % 2 === 0) ctx.globalAlpha = 0.62;
  drawSprite(spr, sx, sy, m.face);
  ctx.globalAlpha = 1;

  // Das getragene Symbol wippt mit dem Affen mit, sonst zappelt es
  // unabhaengig von ihm. Im Stehen ein ruhiges, langsames Schweben.
  if (m.itemReady) {
    const isp = SPR[itemKindOf(m)];
    const ix = m.face > 0 ? m.x + HB_W - 1 : m.x - ITEM_W + 1;
    const iy = m.y + 5 + (laeuft ? bob : stepBob(m.anim, 0.7));
    drawSprite(isp, ix, iy, m.face);
  }

  if (m.sniff > 0) {
    ctx.fillStyle = "#ff9ec4";
    const t = Math.sin(m.anim * 8) * 2;
    ctx.fillRect(Math.round(m.x + 2 + t), Math.round(m.y - 6), 2, 2);
    ctx.fillRect(Math.round(m.x + 5 + t), Math.round(m.y - 10), 3, 3);
  } else if (m.slip > 0) {
    ctx.fillStyle = "#f5d13b";
    ctx.fillRect(Math.round(m.x + 4), Math.round(m.y - 9), 2, 5);
    ctx.fillRect(Math.round(m.x + 4), Math.round(m.y - 3), 2, 2);
  } else if (m.freeze > 0) {
    ctx.fillStyle = "#cfe8d4";
    const n = Math.floor(m.freeze * 4) % 3;
    for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(m.x + 1 + i * 3), Math.round(m.y - 5), 2, 2);
  }
}

function drawDrops() {
  for (const d of drops) {
    if (d.life < 2 && Math.floor(d.life * 8) % 2 === 0) continue;
    drawSprite(d.kind === "banana" ? SPR.banana : SPR.flower, d.x, d.y, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }
  ctx.globalAlpha = 1;
}

function text(str, x, y, col, align, size) {
  ctx.fillStyle = col || "#fff";
  ctx.font = (size || 8) + 'px "Courier New", Courier, monospace';
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.fillText(str, Math.round(x), Math.round(y));
}

// Drei Herzen zeigen, wie oft jemand schon Faenger war
function drawHeartRow(x, y, count) {
  for (let i = 0; i < IT_TARGET; i++) {
    drawSprite(i < count ? SPR.heart : SPR.heartOff, x + i * 8, y, 1);
  }
}

function drawHUD() {
  ctx.fillStyle = "rgba(6,14,10,0.74)";
  ctx.fillRect(0, 0, W, HUD_ROWS * TILE - 5);

  text("SCORE " + Math.floor(score), 3, 2, "#ffe066", "left", 8);
  text("BEST " + best, W - 3, 2, "#7fa88a", "right", 7);

  text("YOU", 3, 13, "#cfe8d4", "left", 7);
  drawHeartRow(18, 12, player.itCount);
  drawHeartRow(W - 42, 12, rival.itCount);
  text("HIM", W - 3, 13, "#cfe8d4", "right", 7);

  if (player.it) text("YOU'RE IT - CATCH HIM!", W / 2, 23, "#ff6b5a", "center", 8);
  else           text("RUN!", W / 2, 23, "#8ef2a0", "center", 8);

  if (toastTime > 0) {
    ctx.globalAlpha = Math.min(1, toastTime * 1.6);
    text(toastText, W / 2, HUD_ROWS * TILE, toastCol, "center", 8);
    ctx.globalAlpha = 1;
  }
}

function drawStick() {
  if (!stickActive) return;
  ctx.strokeStyle = "rgba(255,255,255,0.26)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(stickOX, stickOY, 16, 0, Math.PI * 2); ctx.stroke();
  const dx = Math.max(-16, Math.min(16, stickX - stickOX));
  const dy = Math.max(-16, Math.min(16, stickY - stickOY));
  ctx.fillStyle = "rgba(255,255,255,0.38)";
  ctx.beginPath(); ctx.arc(stickOX + dx, stickOY + dy, 6, 0, Math.PI * 2); ctx.fill();
}

function drawItemButton() {
  const ready = player.itemReady;
  const tint = (playerItem === "banana") ? "245,209,59" : "253,253,245";
  ctx.beginPath();
  ctx.arc(itemBtn.x, itemBtn.y, itemBtn.r, 0, Math.PI * 2);
  ctx.fillStyle = ready ? "rgba(" + tint + ",0.18)" : "rgba(255,255,255,0.07)";
  ctx.fill();
  ctx.strokeStyle = ready ? "rgba(" + tint + ",0.8)" : "rgba(255,255,255,0.18)";
  ctx.lineWidth = 1;
  ctx.stroke();

  if (ready) {
    drawSprite(SPR[playerItem], itemBtn.x - ITEM_W / 2, itemBtn.y - ITEM_H / 2, 1);
  } else {
    const frac = 1 - player.itemTimer / ITEM_COOLDOWN;
    ctx.beginPath();
    ctx.arc(itemBtn.x, itemBtn.y, itemBtn.r - 3, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.strokeStyle = "rgba(" + tint + ",0.55)";
    ctx.stroke();
  }
}

function drawPanel(lines, startY) {
  ctx.fillStyle = "rgba(6,14,10,0.87)";
  ctx.fillRect(0, 0, W, H);
  let y = startY !== undefined ? startY : H * 0.2;
  for (const l of lines) {
    text(l.t, W / 2, y, l.c, "center", l.s || 8);
    y += (l.s || 8) + (l.gap || 5);
  }
}

/* ---------- Startseite: Rollenwahl ----------
   Nur die beiden Symbole. Antippen waehlt, dann Start. */
const CHOICE_K = 5;                     // Vergroesserung der Symbole
const uiFlower = { x: 0, y: 0, w: 0, h: 0 };
const uiBanana = { x: 0, y: 0, w: 0, h: 0 };
const uiStart  = { x: 0, y: 0, w: 0, h: 0 };
let roleChosen = false;

function layoutTitle() {
  const box = ITEM_W * CHOICE_K + 14;
  const top = Math.round(H * 0.30);
  uiFlower.w = uiFlower.h = uiBanana.w = uiBanana.h = box;
  uiFlower.x = Math.round(W / 2 - box - 7);
  uiBanana.x = Math.round(W / 2 + 7);
  uiFlower.y = uiBanana.y = top;

  uiStart.w = 98; uiStart.h = 26;
  uiStart.x = Math.round(W / 2 - uiStart.w / 2);
  uiStart.y = top + box + 40;
}

function hits(box, p) {
  return p.x >= box.x && p.x <= box.x + box.w && p.y >= box.y && p.y <= box.y + box.h;
}

function drawChoice(box, kind, mine) {
  const tint = (kind === "banana") ? "245,209,59" : "253,253,245";
  ctx.fillStyle = mine ? "rgba(" + tint + ",0.16)" : "rgba(255,255,255,0.04)";
  ctx.fillRect(box.x, box.y, box.w, box.h);
  ctx.strokeStyle = mine ? "rgb(" + tint + ")" : "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1);
  if (mine) {
    ctx.strokeRect(box.x + 2.5, box.y + 2.5, box.w - 5, box.h - 5);
  }
  drawSpriteScaled(SPR[kind],
    box.x + (box.w - ITEM_W * CHOICE_K) / 2,
    box.y + (box.h - ITEM_H * CHOICE_K) / 2, CHOICE_K);
}

function drawTitle() {
  drawBackground();
  drawLeaves();
  ctx.fillStyle = "rgba(6,14,10,0.87)";
  ctx.fillRect(0, 0, W, H);
  layoutTitle();

  text("MONKEY CHASE", W / 2, H * 0.13, "#ffe066", "center", 15);
  text("WHICH ONE ARE YOU?", W / 2, H * 0.21, "#cfe8d4", "center", 9);

  drawChoice(uiFlower, "flower", roleChosen && playerItem === "flower");
  drawChoice(uiBanana, "banana", roleChosen && playerItem === "banana");

  const labelY = uiFlower.y + uiFlower.h + 7;
  if (roleChosen) {
    const mine = (playerItem === "flower") ? uiFlower : uiBanana;
    const theirs = (playerItem === "flower") ? uiBanana : uiFlower;
    text("YOU", mine.x + mine.w / 2, labelY, "#ffe066", "center", 8);
    text("CPU", theirs.x + theirs.w / 2, labelY, "#7fa88a", "center", 8);
  }

  // Startknopf, bis zur Wahl gedaempft
  ctx.fillStyle = roleChosen ? "rgba(255,224,102,0.18)" : "rgba(255,255,255,0.04)";
  ctx.fillRect(uiStart.x, uiStart.y, uiStart.w, uiStart.h);
  ctx.strokeStyle = roleChosen ? "#ffe066" : "rgba(255,255,255,0.18)";
  ctx.lineWidth = 1;
  ctx.strokeRect(uiStart.x + 0.5, uiStart.y + 0.5, uiStart.w - 1, uiStart.h - 1);
  text("START", uiStart.x + uiStart.w / 2, uiStart.y + 8,
       roleChosen ? "#ffe066" : "#5d6b62", "center", 12);
}

function drawOver() {
  drawBackground();
  drawLeaves();
  ctx.fillStyle = "rgba(6,14,10,0.88)";
  ctx.fillRect(0, 0, W, H);

  const top = Math.round(H * 0.09);
  const hk = 6;                           // Herz
  const k = 4;                            // Endbild vergroessert
  const sh = SPR.hug.height * k;
  const heartY = top + 16 + Math.sin(clock * 2.2) * 3;
  const sy = top + 20 + SPR.heart.height * hk;

  text("FRIENDS AGAIN", W / 2, top, "#ff8f7a", "center", 10);
  drawSpriteScaled(SPR.heart, W / 2 - (SPR.heart.width * hk) / 2, heartY, hk);
  drawSpriteScaled(SPR.hug, (W - SPR.hug.width * k) / 2, sy, k);

  let y = sy + sh + 14;
  text("Each of you was it", W / 2, y, "#cfe8d4", "center", 8); y += 10;
  text("three times.", W / 2, y, "#cfe8d4", "center", 8); y += 20;
  text("SCORE", W / 2, y, "#cfe8d4", "center", 8); y += 12;
  text(String(Math.floor(score)), W / 2, y, "#8ef2a0", "center", 20); y += 28;
  const s = Math.floor(score);
  text(s >= best ? "NEW RECORD!" : "BEST " + best,
       W / 2, y, s >= best ? "#ffe066" : "#7fa88a", "center", 9); y += 20;
  text("TAP FOR A NEW ROUND", W / 2, y, "#ffe066", "center", 9);
}

function render() {
  if (state === STATE.TITLE) { drawTitle(); return; }
  if (state === STATE.OVER)  { drawOver();  return; }

  drawBackground();
  drawLeaves();
  drawDrops();
  drawMonkey(rival);
  drawMonkey(player);
  drawParticles();
  drawHUD();
  drawItemButton();
  drawStick();
}

/* ============================================================
   Hauptschleife
   ============================================================ */
let last = 0;
function frame(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 1 / 20) dt = 1 / 20;
  clock += dt;

  if (state === STATE.PLAY) {
    if (!player.it) score += dt * PTS_PER_SEC;
    updateMonkey(player, inputDir(), dt, 1);
    updateAI(dt);
    updateDrops(dt);
    checkTag();
  }

  if (toastTime > 0) toastTime -= dt;
  updateParticles(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   Ereignisse
   ============================================================ */
function toLogical(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / (r.width / W), y: (cy - r.top) / (r.height / H) };
}

function startRound() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  resetRound();
  state = STATE.PLAY;
}

function onDown(id, cx, cy) {
  if (state === STATE.TITLE) {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    const q = toLogical(cx, cy);
    if (hits(uiFlower, q)) { playerItem = "flower"; roleChosen = true; blip(760, 0.06); return; }
    if (hits(uiBanana, q)) { playerItem = "banana"; roleChosen = true; blip(560, 0.06); return; }
    if (roleChosen && hits(uiStart, q)) startRound();
    return;
  }
  if (state === STATE.OVER) { startRound(); return; }
  const p = toLogical(cx, cy);
  if (Math.hypot(p.x - itemBtn.x, p.y - itemBtn.y) <= itemBtn.r + 4) { dropItem(player); return; }
  if (stickId === null) {
    stickId = id; stickOX = p.x; stickOY = p.y; stickX = p.x; stickY = p.y;
    stickActive = true;
  } else {
    dropItem(player);
  }
}
function onMove(id, cx, cy) {
  if (id !== stickId) return;
  const p = toLogical(cx, cy);
  stickX = p.x; stickY = p.y;
}
function onUp(id) {
  if (id === stickId) { stickId = null; stickActive = false; }
}

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener("touchend", e => {
  e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier);
}, { passive: false });
canvas.addEventListener("touchcancel", e => {
  for (const t of e.changedTouches) onUp(t.identifier);
}, { passive: false });

canvas.addEventListener("mousedown", e => onDown("m", e.clientX, e.clientY));
window.addEventListener("mousemove", e => onMove("m", e.clientX, e.clientY));
window.addEventListener("mouseup", () => onUp("m"));

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " " || e.key === "Shift") {
    if (state === STATE.PLAY) dropItem(player);
    e.preventDefault();
  }
  if (e.key === "Enter") {
    if (state === STATE.OVER) startRound();
    else if (state === STATE.TITLE && roleChosen) startRound();
  }
  if (state === STATE.TITLE && (e.key === "1" || e.key === "2")) {
    playerItem = (e.key === "1") ? "flower" : "banana";
    roleChosen = true;
  }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout, 250));
document.addEventListener("visibilitychange", () => { last = 0; });

// ---------- Start ----------
buildSprites();
layout();
state = STATE.TITLE;
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
